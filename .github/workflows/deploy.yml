name: CI/CD - Filmora

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  ci:
    name: Validar site estático
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Validar estrutura e páginas HTML
        run: |
          test -s index.html
          test -d assets
          test -d pages
          html_files=$(find . -type f -name '*.html' -not -path './.git/*')
          test -n "$html_files"
          while IFS= read -r file; do
            grep -qi '<!doctype html' "$file" || {
              echo "DOCTYPE ausente em $file"
              exit 1
            }
            grep -qi '</html>' "$file" || {
              echo "Fechamento HTML ausente em $file"
              exit 1
            }
          done <<< "$html_files"

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
